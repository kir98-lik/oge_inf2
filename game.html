<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ-Квест — тренажёр по информатике</title>
<style>
        /* Кнопка возврата к тренажёру */
    .back-btn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #e52521; /* Красный цвет Марио */
        color: #fff;
        text-decoration: none;
        padding: 12px 24px;
        font-size: 12px;
        border: 4px solid #fff;
        border-radius: 8px;
        box-shadow: 0 6px 0 #8b0000;
        font-family: 'Press Start 2P', monospace;
        z-index: 999; /* Поверх всех окон */
        transition: transform 0.1s, box-shadow 0.1s;
        text-align: center;
        white-space: nowrap;
    }
    .back-btn:hover {
        transform: translateX(-50%) translateY(-2px);
    }
    .back-btn:active {
        transform: translateX(-50%) translateY(6px);
        box-shadow: none;
    }
    @media(max-width: 600px) {
        .back-btn { font-size: 10px; padding: 10px 15px; bottom: 10px; }
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
        --bg-color: #5c94fc;
        --block-color: #e52521;
        --block-border: #8b0000;
        --pipe-color: #43b047;
        --pipe-border: #1b5e20;
        --text-color: #fff;
    }

    body.theme-jungle { --bg-color: #1b3a2a; --block-color: #8b5a2b; --block-border: #4a3015; --pipe-color: #2d6a4f; --pipe-border: #1b4332; }
    body.theme-cyber { --bg-color: #0a0714; --block-color: #ff4dd2; --block-border: #8a0066; --pipe-color: #4df0ff; --pipe-border: #007a8a; }
    body.theme-ocean { --bg-color: #051524; --block-color: #22b8cf; --block-border: #0b5b6b; --pipe-color: #7be3ff; --pipe-border: #2b8ca3; }
    body.theme-volcano { --bg-color: #1a0805; --block-color: #ff7a3d; --block-border: #993d15; --pipe-color: #ffc94d; --pipe-border: #997400; }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0; padding: 0;
        background-color: var(--bg-color);
        font-family: 'Press Start 2P', monospace;
        color: var(--text-color);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.5s;
    }

    /* Облака */
    .cloud { position: absolute; background: #fff; width: 100px; height: 40px; border-radius: 20px; opacity: 0.8; animation: float 20s linear infinite; z-index: 0; }
    .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
    .cloud::before { width: 50px; height: 50px; top: -20px; left: 15px; }
    .cloud::after { width: 70px; height: 70px; top: -30px; left: 45px; }
    .c1 { top: 10%; left: -20%; animation-duration: 25s; }
    .c2 { top: 30%; left: -40%; animation-duration: 35s; }
    .c3 { top: 50%; left: -10%; animation-duration: 28s; }
    @keyframes float { from { transform: translateX(-100px); } to { transform: translateX(100vw); } }

    /* Главное меню */
    #main-menu { position: relative; z-index: 10; text-align: center; background: rgba(0,0,0,0.85); padding: 40px; border: 4px solid #fff; border-radius: 12px; max-width: 800px; width: 90%; box-shadow: 0 10px 0 rgba(0,0,0,0.5); }
    h1 { font-size: 24px; color: #ffd700; text-shadow: 4px 4px 0 #e52521; margin-bottom: 10px; line-height: 1.4; }
    .subtitle { font-size: 10px; color: #ccc; margin-bottom: 30px; }
    
    .levels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media(max-width: 600px) { .levels-grid { grid-template-columns: 1fr; } }

    .level-btn { background: var(--block-color); color: #fff; border: 4px solid #fff; padding: 15px; font-family: inherit; font-size: 12px; cursor: pointer; border-radius: 8px; box-shadow: 0 6px 0 var(--block-border); transition: transform 0.1s, box-shadow 0.1s; text-align: left; }
    .level-btn:hover { transform: translateY(-2px); }
    .level-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--block-border); }
    .level-btn small { display: block; font-size: 8px; margin-top: 8px; color: #ffd700; }

    /* Игровой экран */
    #game-screen { display: none; width: 100%; height: 100%; position: relative; z-index: 10; flex-direction: column; }
    
    .hud { display: flex; justify-content: space-between; padding: 15px 20px; background: #000; border-bottom: 4px solid #fff; font-size: 10px; z-index: 20; flex-wrap: wrap; gap: 10px; }
    .hud span { color: #ffd700; }
    .hud .timer { color: #ff8c00; }

    .question-container { margin: 20px auto; background: #fff; color: #000; padding: 20px; border: 4px solid #000; border-radius: 8px; width: 90%; max-width: 800px; font-size: 12px; line-height: 1.6; text-align: center; box-shadow: inset -4px -4px 0 #ccc; white-space: pre-wrap; z-index: 20; transition: background 0.3s; }

    /* Игровое поле (Платформер) */
    .play-area { flex: 1; position: relative; overflow: hidden; border-bottom: 8px solid #c84c0c; background: rgba(0,0,0,0.2); }
    .block-row { position: absolute; bottom: 180px; width: 100%; display: flex; justify-content: center; gap: 40px; }
    .block-row.shake { animation: rowShake 0.5s ease; }

    @keyframes rowShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .q-block { width: 80px; height: 80px; background: var(--block-color); border: 4px solid #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 10px; text-align: center; color: #fff; cursor: pointer; box-shadow: inset -6px -6px 0 rgba(0,0,0,0.3), 0 6px 0 var(--block-border); transition: transform 0.1s; padding: 5px; word-break: break-all; position: relative; }
    .q-block::before { content: '❓'; position: absolute; font-size: 20px; opacity: 0.3; }
    .q-block span { position: relative; z-index: 2; font-weight: bold; }

    .mario { position: absolute; bottom: 0; left: 50px; width: 50px; height: 50px; font-size: 50px; display: flex; justify-content: center; align-items: flex-end; z-index: 10; }

    /* Модальные окна */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
    
    .modal-content { background: #fff; color: #000; border: 6px solid #000; border-radius: 12px; padding: 30px; max-width: 600px; width: 100%; text-align: center; box-shadow: 10px 10px 0 rgba(0,0,0,0.5); }
    .modal-content h2 { font-size: 16px; color: #e52521; margin-top: 0; line-height: 1.4; }
    .modal-content p { font-size: 10px; line-height: 1.6; margin-bottom: 20px; }
    .modal-content .emoji-big { font-size: 60px; display: block; margin: 20px 0; }
    
    .continue-btn { background: #5c94fc; color: #fff; border: 4px solid #000; padding: 12px 24px; font-family: inherit; font-size: 12px; cursor: pointer; border-radius: 6px; box-shadow: 0 4px 0 #000; }
    .continue-btn:active { transform: translateY(4px); box-shadow: none; }

    /* Контейнер для видео и ссылок */
    #modalMedia { display: none; margin: 20px 0; }
    #modalMedia.active { display: block; animation: fadeIn 0.5s; }
    #modalMedia iframe { width: 100%; aspect-ratio: 16/9; border: 4px solid #000; border-radius: 8px; }
    
    .media-link-btn { display: inline-block; background: #ff8c00; color: #fff; text-decoration: none; padding: 15px 30px; border: 4px solid #000; border-radius: 8px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 0 #993d15; transition: transform 0.1s; }
    .media-link-btn:active { transform: translateY(4px); box-shadow: none; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>

// Переменная для хранения текущей колоды штрафных вопросов
let penaltyPool = [];

function initPenaltyPool() {
    // Перемешиваем копию массива

function getNextPenaltyQuestion() {

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'coin') { osc.type='square'; osc.frequency.setValueAtTime(987.77,now); osc.frequency.setValueAtTime(1318.51,now+0.1); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.4); osc.start(now); osc.stop(now+0.4); }
    else if (type === 'die') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300,now); osc.frequency.exponentialRampToValueAtTime(50,now+0.8); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.8); osc.start(now); osc.stop(now+0.8); }
    else if (type === 'bump') { osc.type='square'; osc.frequency.setValueAtTime(150,now); osc.frequency.exponentialRampToValueAtTime(80,now+0.2); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.2); osc.start(now); osc.stop(now+0.2); }
    else if (type === 'powerup') { osc.type='triangle'; osc.frequency.setValueAtTime(440,now); osc.frequency.linearRampToValueAtTime(880,now+0.2); osc.frequency.linearRampToValueAtTime(1760,now+0.4); gain.gain.setValueAtTime(0.1,now); gain.gain.linearRampToValueAtTime(0.01,now+0.5); osc.start(now); osc.stop(now+0.5); }
    else if (type === 'shuffle') { osc.type='sine'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(800,now+0.1); osc.frequency.exponentialRampToValueAtTime(400,now+0.2); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.3); osc.start(now); osc.stop(now+0.3); }
}

/* =========================================================
   СОСТОЯНИЕ И ФИЗИКА
   ========================================================= */
const state = { 
    levelIdx: 0, qIdx: 0, score: 0, lives: 3, isPenalty: false, locked: false, 
    marioX: 50, marioY: 0, marioVY: 0, isJumping: false, targetX: null,
    timeLeft: 480,
    currentPenaltyTask: null // Храним текущее штрафное задание
};

const elements = {
    menu: document.getElementById('main-menu'), game: document.getElementById('game-screen'),
    question: document.getElementById('questionText'), blockRow: document.getElementById('blockRow'),
    mario: document.getElementById('mario'), score: document.getElementById('scoreDisplay'),
    level: document.getElementById('levelDisplay'), progress: document.getElementById('qProgress'),
    lives: document.getElementById('livesDisplay'), playArea: document.getElementById('playArea'),
    modal: document.getElementById('modal'), mTitle: document.getElementById('modalTitle'),
    mEmoji: document.getElementById('modalEmoji'), mText: document.getElementById('modalText'),
    mMedia: document.getElementById('modalMedia'), mBtn: document.getElementById('modalBtn'),
    timerDisplay: document.getElementById('shuffleTimerDisplay')
};

const BLOCK_Y = 180;
const GRAVITY = 0.8;
const JUMP_POWER = 17;
const SPEED = 15;

/* =========================================================
   ТАЙМЕР ПЕРЕМЕШИВАНИЯ
   ========================================================= */
let timerInterval;

function startShuffleTimer() {
    clearInterval(timerInterval);
    state.timeLeft = 480;
    updateTimerDisplay();
    
    timerInterval = setInterval(() => {
        if (state.locked || elements.game.style.display === 'none' || elements.modal.classList.contains('active')) return;
        
        state.timeLeft--;
        updateTimerDisplay();
        
        if (state.timeLeft <= 0) {
            shuffleAnswers();
            state.timeLeft = 480;
        }
    }, 1000);
}

function updateTimerDisplay() {
    const m = Math.floor(state.timeLeft / 60);
    const s = state.timeLeft % 60;
    elements.timerDisplay.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    elements.timerDisplay.style.color = state.timeLeft < 60 ? '#e52521' : '#ff8c00';
}

function shuffleAnswers() {
    const blocks = Array.from(elements.blockRow.children);
    if (blocks.length === 0) return;
    
    for (let i = blocks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    }
    
    elements.blockRow.innerHTML = '';
    blocks.forEach(block => elements.blockRow.appendChild(block));
    
    playSound('shuffle');
    elements.blockRow.classList.add('shake');
    setTimeout(() => elements.blockRow.classList.remove('shake'), 500);
    
    const originalText = elements.question.innerHTML;
    elements.question.innerHTML = `<span style="color:#e52521; font-weight:bold; display:block; margin-bottom:10px;">⏳ ВРЕМЯ ВЫШЛО! ОТВЕТЫ ПЕРЕМЕШАНЫ.</span>${originalText}`;
}

/* =========================================================
   ИГРОВОЙ ЦИКЛ (ФИЗИКА)
   ========================================================= */
function gameLoop() {
    if (elements.game.style.display === 'none') { requestAnimationFrame(gameLoop); return; }

    if (state.targetX !== null) {
        if (Math.abs(state.marioX - state.targetX) <= SPEED) {
            state.marioX = state.targetX; state.targetX = null; jump();
        } else if (state.marioX < state.targetX) { state.marioX += SPEED; } else { state.marioX -= SPEED; }
    }

    if (state.isJumping) {
        state.marioY += state.marioVY;
        state.marioVY -= GRAVITY;

        if (state.marioY <= 0) { state.marioY = 0; state.marioVY = 0; state.isJumping = false; }

        if (state.marioVY > 0 && state.marioY >= BLOCK_Y - 10 && state.marioY <= BLOCK_Y + 40) {
            const blocks = document.querySelectorAll('.q-block');
            for (let i = 0; i < blocks.length; i++) {
                const bx = blocks[i].offsetLeft; const bw = blocks[i].offsetWidth;
                if (state.marioX + 40 > bx && state.marioX < bx + bw) {
                    state.marioY = BLOCK_Y; state.marioVY = 0; state.isJumping = false;
                    triggerAnswer(i); break;
                }
            }
        }
    }
    elements.mario.style.left = state.marioX + 'px';
    elements.mario.style.bottom = state.marioY + 'px';
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* =========================================================
   УПРАВЛЕНИЕ
   ========================================================= */
document.addEventListener('keydown', (e) => {
    if (state.locked || elements.game.style.display === 'none') return;
    if (e.key === 'ArrowLeft') { state.targetX = null; state.marioX = Math.max(0, state.marioX - SPEED); elements.mario.style.transform = "scaleX(-1)"; }
    else if (e.key === 'ArrowRight') { state.targetX = null; state.marioX = Math.min(elements.playArea.offsetWidth - 50, state.marioX + SPEED); elements.mario.style.transform = "scaleX(1)"; }
    else if (e.key === 'ArrowUp' || e.key === ' ') { e.preventDefault(); jump(); }
});

function jump() { if (!state.isJumping && !state.locked) { state.isJumping = true; state.marioVY = JUMP_POWER; } }
function moveToBlock(index) { if (state.locked) return; const block = document.querySelectorAll('.q-block')[index]; state.targetX = block.offsetLeft + (block.offsetWidth / 2) - 25; elements.mario.style.transform = "scaleX(1)"; }

/* =========================================================
   ИГРОВАЯ ЛОГИКА
   ========================================================= */
function startGame(levelIdx) {
    initAudio(); 
    initPenaltyPool(); // Инициализируем/перемешиваем колоду штрафов при старте
    
    state.levelIdx = levelIdx; state.qIdx = 0; state.score = 0; state.lives = 3; state.isPenalty = false;
    document.body.className = LEVELS[levelIdx].theme;
    elements.menu.style.display = 'none'; elements.game.style.display = 'flex'; elements.level.textContent = levelIdx + 1;
    loadQuestion();
}

function updateHUD() {
    elements.score.textContent = state.score; elements.progress.textContent = (state.qIdx + 1) + '/16';
    elements.lives.textContent = '❤️'.repeat(state.lives) + '🖤'.repeat(3 - state.lives);
}

function loadQuestion() {
    if (state.qIdx >= 16) { endGame(true); return; }
    state.locked = false; state.marioX = 50; state.marioY = 0; state.marioVY = 0; state.isJumping = false; state.targetX = null;
    
    // Если это штраф, берем задание из state.currentPenaltyTask, иначе из текущего уровня
    const qData = state.isPenalty ? state.currentPenaltyTask : LEVELS[state.levelIdx].questions[state.qIdx];
    
    elements.question.textContent = (state.isPenalty ? "[ШТРАФ] " : "") + qData.q;
    elements.blockRow.innerHTML = '';
    
    const opts = qData.opts.map((text, i) => ({ text, isCorrect: i === qData.a }));
    opts.sort(() => Math.random() - 0.5);

    opts.forEach((opt, i) => {
        const block = document.createElement('div');
        block.className = 'q-block';
        if (state.isPenalty) block.style.background = '#ff8c00';
        block.innerHTML = `<span>${opt.text}</span>`;
        block.onclick = () => moveToBlock(i);
        block.dataset.correct = opt.isCorrect;
        elements.blockRow.appendChild(block);
    });
    
    updateHUD();
    startShuffleTimer();
}

function triggerAnswer(index) {
    if (state.locked) return;
    state.locked = true;
    clearInterval(timerInterval);

    const block = document.querySelectorAll('.q-block')[index];
    const isCorrect = block.dataset.correct === 'true';
    
    block.style.transform = "translateY(-10px)";
    setTimeout(() => block.style.transform = "translateY(0)", 150);

    if (isCorrect) {
        playSound('coin'); block.style.background = '#43b047'; block.innerHTML = '🪙';
        state.score += 100 + (state.isPenalty ? 0 : 20);
        setTimeout(() => showReward(), 600);
    } else {
        playSound('bump'); block.style.background = '#555'; block.innerHTML = '💀';
        document.querySelectorAll('.q-block').forEach(b => { if (b.dataset.correct === 'true') b.style.background = '#43b047'; });
        setTimeout(() => handlePenalty(), 800);
    }
}

/* =========================================================
   БОНУСЫ И ШТРАФЫ
   ========================================================= */
const relaxBonuses = [
    { title: "ПЕРЕЗАГРУЗКА", emoji: "🐈", text: "Закрой глаза на 5 секунд. Представь, что гладишь котика. Сделай глубокий вдох и выдох." },
    { title: "ПЕРЕРЫВ", emoji: "☕", text: "Сделай глоток воды. Разомни шею и плечи. Ты отлично справляешься!" },
    { title: "МЕДИТАЦИЯ", emoji: "🧘", text: "Вдох на 4 счета, задержка на 4, выдох на 4. Повтори 3 раза." }
];

function showReward() {
    elements.mMedia.innerHTML = '';
    elements.mMedia.classList.remove('active');

    if (state.isPenalty) {
        state.isPenalty = false;
        elements.modal.classList.add('active');
        elements.mTitle.textContent = "ИСПЫТАНИЕ ПРОЙДЕНО!";
        elements.mTitle.style.color = "#43b047";
        elements.mEmoji.textContent = "🏆";
        elements.mEmoji.style.display = "block";
        elements.mText.innerHTML = "Ты справился со штрафным заданием и сохранил прогресс!";
        elements.mBtn.onclick = () => { elements.modal.classList.remove('active'); state.qIdx++; loadQuestion(); };
        return;
    }

    const roll = Math.random();
    elements.modal.classList.add('active');
    elements.mTitle.style.color = "#43b047";

    if (roll < 0.40) {
        const relax = relaxBonuses[Math.floor(Math.random() * relaxBonuses.length)];
        elements.mTitle.textContent = "ОТЛИЧНО!";
        elements.mEmoji.textContent = relax.emoji;
        elements.mEmoji.style.display = "block";
        elements.mText.innerHTML = `<b>${relax.title}</b><br><br>${relax.text}`;
    } 
    else if (roll < 0.60) {
        elements.mTitle.textContent = "ПОБЕДА!";
        elements.mEmoji.textContent = "🪙";
        elements.mEmoji.style.display = "block";
        elements.mText.innerHTML = "Ты получаешь бонусные монеты!<br>+20 очков.";
        state.score += 20;
        updateHUD();
    } 
    else {
        const media = MEDIA_REWARDS[Math.floor(Math.random() * MEDIA_REWARDS.length)];
        elements.mTitle.textContent = media.title;
        elements.mEmoji.style.display = "none";
        elements.mText.innerHTML = media.text;
        elements.mMedia.classList.add('active');

        if (media.type === 'video') {
            elements.mMedia.innerHTML = `<iframe src="${media.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } else if (media.type === 'link') {
            elements.mMedia.innerHTML = `<a href="${media.url}" target="_blank" class="media-link-btn">${media.btnText || 'Открыть ссылку'}</a>`;
        }
    }

    elements.mBtn.onclick = () => {
        elements.modal.classList.remove('active');
        elements.mMedia.innerHTML = '';
        state.qIdx++;
        loadQuestion();
    };
}

function handlePenalty() {
    if (state.isPenalty) { 
        // Если провалили ШТРАФНОЕ задание — игра окончена
        gameOver(); 
        return; 
    }
    
    const roll = Math.random();
    if (roll < 0.20) { 
        gameOver(); 
    } 
    else {
        // 80% шанс: достаем УНИКАЛЬНОЕ штрафное задание
        state.currentPenaltyTask = getNextPenaltyQuestion();
        
        elements.modal.classList.add('active');
        elements.mTitle.textContent = "ШТРАФНОЕ ЗАДАНИЕ!";
        elements.mTitle.style.color = "#ff8c00";
        elements.mEmoji.textContent = "⚠️";
        elements.mEmoji.style.display = "block";
        elements.mText.innerHTML = "Марио дает тебе второй шанс.<br>Реши дополнительное задание!";
        
        elements.mBtn.onclick = () => {
            elements.modal.classList.remove('active'); 
            state.isPenalty = true; 
            state.lives--; 
            updateHUD();
            if (state.lives <= 0) { gameOver(); return; }
            loadQuestion();
        };
    }
}

function gameOver() {
    clearInterval(timerInterval);
    playSound('die');
    elements.mario.textContent = "👻";
    elements.mario.style.transform = "translateY(-50px) rotate(180deg)";
    elements.modal.classList.add('active');
    elements.mTitle.textContent = "GAME OVER";
    elements.mTitle.style.color = "#e52521";
    elements.mEmoji.textContent = "💀";
    elements.mEmoji.style.display = "block";
    elements.mText.innerHTML = "Марио проиграл!<br>Твой прогресс сброшен. Придется начать уровень заново.";
    elements.mBtn.textContent = "В главное меню";
    elements.mBtn.onclick = () => {
        elements.modal.classList.remove('active');
        elements.mario.textContent = "👨‍🔧";
        elements.mario.style.transform = "translateY(0) rotate(0deg)";
        elements.game.style.display = 'none'; elements.menu.style.display = 'block';
    };
}

function endGame(win) {
    clearInterval(timerInterval);
    if (win) {
        playSound('powerup');
        elements.modal.classList.add('active');
        elements.mTitle.textContent = "УРОВЕНЬ ПРОЙДЕН!";
        elements.mTitle.style.color = "#ffd700";
        elements.mEmoji.textContent = "👑";
        elements.mEmoji.style.display = "block";
        elements.mText.innerHTML = `Ты прошел мир «${LEVELS[state.levelIdx].name}»!<br>Счет: <b>${state.score}</b> монет.`;
        elements.mBtn.textContent = "В главное меню";
        elements.mBtn.onclick = () => {
            elements.modal.classList.remove('active');
            elements.game.style.display = 'none'; elements.menu.style.display = 'block';
        };
    }
}
</script>
