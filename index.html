/* =========================================================
   ЛОГИКА
   ========================================================= */
const VARIANTS = [1, 2, 3];
let currentVariant = 1;
const solved = {};

function norm(v) {
  return String(v).toLowerCase().replace(/\s+/g, " ").trim().replace(/\//g, "\\");
}

function renderVariantButtons() {
  const box = document.getElementById("variants");
  box.innerHTML = "";
  VARIANTS.forEach(v => {
    const b = document.createElement("button");
    b.className = "v-btn" + (v === currentVariant ? " active" : "");
    b.textContent = "Вариант " + v;
    b.onclick = () => { currentVariant = v; renderVariantButtons(); renderTasks(); };
    box.appendChild(b);
  });
}

function renderTasks() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  TASKS.filter(t => t.variant === currentVariant).forEach(task => app.appendChild(buildCard(task)));
  updateScore();
}

function buildCard(task) {
  const key = task.variant + "-" + task.num;
  const card = document.createElement("section");
  card.className = "task-card";
  card.dataset.key = key;

  const head = document.createElement("div");
  head.className = "task-head";
  head.innerHTML = '<span class="task-num">Задание ' + task.num + '</span><span class="task-topic">' + task.topic + '</span>';
  card.appendChild(head);

  const q = document.createElement("div");
  q.className = "task-question";
  q.innerHTML = task.question;
  card.appendChild(q);

  const body = document.createElement("div");
  body.className = "task-body";

  if (task.type === "choice") {
    const opts = document.createElement("div");
    opts.className = "options";
    task.options.forEach((opt, i) => {
      const label = document.createElement("label");
      label.className = "option";
      label.dataset.index = i;
      label.innerHTML = '<input type="radio" name="q-' + key + '" value="' + i + '"><span>' + opt + '</span>';
      label.querySelector("input").addEventListener("change", () => {
        opts.querySelectorAll(".option").forEach(o => o.classList.remove("picked"));
        label.classList.add("picked");
      });
      opts.appendChild(label);
    });
    body.appendChild(opts);
  } else if (task.type === "input") {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "answer-input";
    inp.placeholder = "Введите ответ...";
    inp.autocomplete = "off";
    inp.addEventListener("keydown", e => { if (e.key === "Enter") checkAnswer(card, task); });
    body.appendChild(inp);
  }
  card.appendChild(body);

  const actions = document.createElement("div");
  actions.className = "task-actions";

  if (task.type === "creative") {
    const btnDone = document.createElement("button");
    btnDone.className = "btn btn-done";
    btnDone.textContent = "Отметить как выполненное";
    btnDone.onclick = () => markAsDone(card, task, btnDone);

    const btnSol = document.createElement("button");
    btnSol.className = "btn btn-sol";
    btnSol.textContent = "Показать критерии";
    btnSol.onclick = () => toggleSolution(card, task, btnSol);

    actions.appendChild(btnDone);
    actions.appendChild(btnSol);
  } else {
    const btnCheck = document.createElement("button");
    btnCheck.className = "btn btn-check";
    btnCheck.textContent = "Проверить";
    btnCheck.onclick = () => checkAnswer(card, task);

    const btnSol = document.createElement("button");
    btnSol.className = "btn btn-sol";
    btnSol.textContent = "Показать решение";
    btnSol.onclick = () => toggleSolution(card, task, btnSol);

    actions.appendChild(btnCheck);
    actions.appendChild(btnSol);
  }
  card.appendChild(actions);

  const fb = document.createElement("div");
  fb.className = "feedback";
  card.appendChild(fb);

  return card;
}

function markAsDone(card, task, btn) {
  const key = task.variant + "-" + task.num;
  solved[key] = true;
  updateScore();
  card.classList.add("correct");
  btn.disabled = true;
  btn.textContent = "Выполнено ✓";
  const fb = card.querySelector(".feedback");
  fb.className = "feedback show ok";
  fb.innerHTML = '<div class="fb-title">✅ Задание отмечено как выполненное</div><div class="fb-text">Не забудьте проверить себя по критериям.</div>';
}

function checkAnswer(card, task) {
  const key = task.variant + "-" + task.num;
  const fb = card.querySelector(".feedback");
  let isCorrect = false;
  let userValue = null;

  if (task.type === "choice") {
    const sel = card.querySelector('input[type="radio"]:checked');
    if (!sel) {
      fb.className = "feedback show tip";
      fb.innerHTML = '<div class="fb-title">Выберите вариант ответа</div><div class="fb-text">Отметьте один из вариантов, затем нажмите «Проверить».</div>';
      return;
    }
    userValue = Number(sel.value);
    isCorrect = userValue === task.answer;
  } else {
    const inp = card.querySelector(".answer-input");
    if (!inp.value.trim()) {
      fb.className = "feedback show tip";
      fb.innerHTML = '<div class="fb-title">Введите ответ</div><div class="fb-text">Запишите ответ в поле и нажмите «Проверить».</div>';
      inp.classList.add("shake");
      setTimeout(() => inp.classList.remove("shake"), 320);
      return;
    }
    userValue = inp.value;
    isCorrect = norm(userValue) === norm(task.answer);
  }

  solved[key] = isCorrect;
  updateScore();
  card.classList.remove("correct", "wrong");

  if (isCorrect) {
    card.classList.add("correct");
    fb.className = "feedback show ok";
    fb.innerHTML = '<div class="fb-title">✅ Верно! Отличная работа</div><div class="fb-text">' + task.solution + "</div>";
    if (task.type === "choice") {
      card.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
      card.querySelector('.option[data-index="' + task.answer + '"]').classList.add("show-right");
    } else {
      const inp = card.querySelector(".answer-input");
      inp.classList.add("correct");
      inp.disabled = true;
    }
    const bc = card.querySelector(".btn-check");
    bc.disabled = true;
    bc.textContent = "Решено ✓";
  } else {
    card.classList.add("wrong");
    fb.className = "feedback show fail";
    let wrongInfo = "";
    if (task.type === "choice") {
      wrongInfo = "Вы выбрали неверный вариант: <b>" + task.options[userValue] + "</b><br>";
      card.querySelectorAll(".option").forEach(o => o.classList.remove("show-right", "show-wrong"));
      card.querySelector('.option[data-index="' + userValue + '"]').classList.add("show-wrong");
    } else {
      wrongInfo = "Ваш ответ: <b>" + escapeHtml(userValue) + "</b> — неверно.<br>";
      card.querySelector(".answer-input").classList.add("wrong");
    }
    fb.innerHTML = '<div class="fb-title">❌ Ошибка</div><div class="fb-text">' + wrongInfo + "Попробуйте ещё раз или нажмите «Показать решение», чтобы увидеть разбор.</div>";
  }
}

function toggleSolution(card, task, btn) {
  const fb = card.querySelector(".feedback");
  if (fb.dataset.solution === "1") {
    fb.dataset.solution = "0";
    fb.className = "feedback";
    fb.innerHTML = "";
    btn.textContent = task.type === "creative" ? "Показать критерии" : "Показать решение";
    return;
  }
  fb.dataset.solution = "1";
  fb.className = "feedback show tip";
  fb.innerHTML = '<div class="fb-title">💡 ' + (task.type === "creative" ? "Критерии и пример" : "Решение") + '</div><div class="fb-text">' + task.solution + "</div>";
  btn.textContent = "Скрыть";
}

function updateScore() {
  const total = TASKS.filter(t => t.variant === currentVariant).length;
  let done = 0;
  TASKS.forEach(t => {
    if (t.variant === currentVariant && solved[t.variant + "-" + t.num] === true) done++;
  });
  document.getElementById("score").innerHTML = "Верно: <b>" + done + "</b> из " + total;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

renderVariantButtons();
renderTasks();
</script>
